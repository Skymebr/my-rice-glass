# =================================================================== #
#   TEMA HYPRLOCK "SEMANTIC GLASS" - ENHANCED
# =================================================================== #

$base       = 0xff1e1e2e
$text       = 0xffcdd6f4
$subtext0   = 0xffa6adc8
$sapphire   = 0xff74c7ec
$sky        = 0xff89dceb
$mauve      = 0xffcba6f7
$red        = 0xfff38ba8
$yellow     = 0xfff9e2af

# --- ANIMAÇÕES ---
animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
}

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = $HOME/.cache/lock_wallpaper.png
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 4
    blur_size = 6
}

image {
    monitor =
    path = $HOME/Downloads/Imagens/♡ Senjougahara hitagi.jpg
    size = 120
    rounding = -1 # Revertido para circular
    border_size = 3
    border_color = $sapphire
    position = 0, 40
    halign = center
    valign = center

    # Sombra sutil
    shadow_passes = 1
    shadow_size = 3
}

input-field {
    monitor =
    size = 280, 60
    position = 0, -80
    halign = center
    valign = center

    # Efeito Glass: Borda sólida e fundo translúcido
    outer_color = $sapphire
    inner_color = rgba(30, 30, 46, 0.4)
    font_color = $text

    placeholder_text = <span foreground="##cdd6f4"><i>Senha...</i></span>
    fail_text = <span foreground="##f38ba8"><i>Senha Incorreta ($ATTEMPTS)</i></span>

    fail_color = $red
    capslock_color = $yellow
    check_color = $sky

    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = false
    hide_input = false
    rounding = 20

    # Sombra sutil
    shadow_passes = 1
    shadow_size = 3
}

# Saudação Dinâmica
label {
    monitor =
    text = cmd[update:600000] ~/.config/hypr/scripts/greeting.sh
    color = $text
    font_size = 14
    font_family = JetBrains Mono Bold
    position = 0, -150
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# Música
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/music.sh
    color = $text
    font_size = 12
    font_family = JetBrains Mono Nerd Font
    position = 0, -190
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# Relógio (Otimizado com variável nativa)
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 100
    font_family = JetBrains Mono ExtraBold
    position = 0, 250
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 4
}

# Data
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d de %B")"
    color = $sapphire
    font_size = 18
    font_family = JetBrains Mono Bold
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
}

# Status (Canto superior direito)
label {
    monitor =
    text = cmd[update:1000] cat /tmp/lock_status 2>/dev/null || echo "󰌾"
    color = $text
    font_size = 14
    font_family = JetBrains Mono Nerd Font Bold
    position = -30, -30
    halign = right
    valign = top
}
